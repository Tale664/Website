<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E I R Reinigung & Gebäudeservice Nürnberg</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root {
            --primary: #0f172a;
            --brand-blue: #2563eb;
            --brand-soft: #3b82f6;
            --bg-light: #f8fafc;
            --bg-card: #ffffff;
            --text-dark: #334155;
            --text-light: #64748b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            scroll-behavior: smooth;
        }

        html {
            scroll-snap-type: y mandatory;
        }

        body {
            background-color: var(--bg-light);
            color: var(--text-dark);
            overflow-x: hidden;
        }

        section {
            min-height: 100vh;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
            scroll-snap-align: start;
            scroll-snap-stop: always;
            padding: 120px 40px 60px 40px;
            position: relative;
        }

        header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.02);
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
        }

        .nav-container {
            max-width: 1600px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            width: 100%;
        }

        .logo-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            border-left: 2px solid var(--brand-blue);
            border-right: 2px solid var(--brand-blue);
            padding: 0 15px;
        }

        .logo-text {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: 38px;
            font-weight: 700;
            color: var(--primary);
            letter-spacing: 6px;
            line-height: 1;
        }

        .logo-subtext {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: var(--brand-blue);
            margin-top: 5px;
            font-weight: 700;
        }

        nav a {
            text-decoration: none;
            color: var(--text-dark);
            font-weight: 600;
            margin-left: 40px;
            transition: all 0.3s;
            font-size: 16px;
        }

        nav a:hover { color: var(--brand-blue); }

        .btn-nav {
            background: var(--brand-blue);
            color: white !important;
            padding: 12px 28px;
            border-radius: 50px;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.15);
        }

        .btn-nav:hover { background: var(--primary); }

        .wide-container {
            width: 100%;
            max-width: 1600px;
            margin: 0 auto;
        }

        .hero {
            background: radial-gradient(circle at top right, #e0f2fe 0%, #ffffff 70%);
        }

        .hero-grid {
            display: grid;
            grid-template-columns: 1.1fr 0.9fr;
            gap: 80px;
            align-items: center;
        }

        .hero-content h1 {
            font-size: 60px;
            color: var(--primary);
            line-height: 1.15;
            margin-bottom: 25px;
            font-weight: 800;
        }

        .hero-content p {
            font-size: 22px;
            color: var(--text-light);
            margin-bottom: 45px;
            line-height: 1.6;
        }

        .hero-image img {
            width: 100%;
            height: 550px;
            object-fit: cover;
            border-radius: 40px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.05);
        }

        .promo-banner {
            background: linear-gradient(90deg, #1e40af 0%, #2563eb 100%);
            color: white;
            padding: 35px;
            text-align: center;
            font-size: 24px;
            border-radius: 24px;
            margin-bottom: 40px;
        }

        .promo-badge {
            background: #ef4444;
            padding: 6px 20px;
            border-radius: 50px;
            font-weight: 800;
            margin-right: 20px;
            display: inline-block;
            font-size: 14px;
            text-transform: uppercase;
        }

        .section-title {
            text-align: center;
            font-size: 44px;
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 40px;
        }
        
        .services-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 20px;
        }

        .service-card {
            background: var(--bg-card);
            border-radius: 24px;
            overflow: hidden;
            border: 1px solid #f1f5f9;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 15px rgba(0,0,0,0.01);
            transition: all 0.3s;
        }

        .service-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 40px rgba(37, 99, 235, 0.08);
        }

        .service-card img {
            width: 100%;
            height: 160px;
            object-fit: cover;
        }

        .service-info { padding: 20px; flex-grow: 1; }
        .service-info h3 { font-size: 18px; color: var(--primary); margin-bottom: 10px; font-weight: 700; }
        .service-info p { font-size: 14px; color: var(--text-light); line-height: 1.5; }

        .form-wrapper {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            padding: 50px;
            border-radius: 40px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.02);
            width: 100%;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }

        .form-group { display: flex; flex-direction: column; gap: 8px; }
        .form-group-full { grid-column: span 2; display: flex; flex-direction: column; gap: 8px; }
        
        label { font-weight: 600; color: var(--primary); font-size: 15px; }
        
        input, select, textarea {
            padding: 16px 20px;
            border: 2px solid #e2e8f0;
            border-radius: 16px;
            font-size: 16px;
            outline: none;
            background: #f8fafc;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--brand-blue);
            background: white;
        }

        .btn-submit {
            grid-column: span 2;
            background: var(--brand-blue);
            color: white;
            border: none;
            padding: 18px;
            font-size: 18px;
            font-weight: 700;
            border-radius: 16px;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(37, 99, 235, 0.15);
        }

        .btn-submit:hover { background: var(--primary); }

        .reviews-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px;
        }

        .review-card {
            background: var(--bg-light);
            padding: 40px;
            border-radius: 32px;
            border-top: 6px solid var(--brand-blue);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .stars { color: #f59e0b; margin-bottom: 15px; font-size: 22px; }
        .review-text { font-style: italic; color: var(--text-dark); font-size: 16px; line-height: 1.6; margin-bottom: 25px; }
        .review-user { font-weight: 700; color: var(--primary); font-size: 15px; }

        .legal-box {
            background: white;
            padding: 40px;
            border-radius: 24px;
            margin-top: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.02);
            border: 1px solid #e2e8f0;
            text-align: left;
        }
        .legal-box h3 { color: var(--primary); margin-bottom: 15px; }
        .legal-box p { font-size: 14px; color: var(--text-light); line-height: 1.6; margin-bottom: 10px; }

        footer { 
            position: absolute;
            bottom: 0;
            width: 100%;
            left: 0;
            background: var(--primary); 
            color: white; 
            padding: 35px 20px; 
            text-align: center; 
        }
        .footer-content p { font-size: 16px; margin-bottom: 10px; }
        .footer-links a { color: #94a3b8; text-decoration: none; margin: 0 20px; }

        @media (max-width: 1400px) {
            .services-grid { grid-template-columns: repeat(3, 1fr); }
            .reviews-grid { grid-template-columns: 1fr 1fr; }
        }

        @media (max-width: 900px) {
            html { scroll-snap-type: none; }
            section { min-height: auto; height: auto; padding: 100px 20px 40px 20px; }
            .hero-grid { grid-template-columns: 1fr; text-align: center; gap: 40px; }
            .hero-content h1 { font-size: 36px; }
            .hero-image img { height: 320px; }
            .services-grid, .reviews-grid, .form-grid { grid-template-columns: 1fr; }
            .form-group-full, .btn-submit { grid-column: span 1; }
            nav { display: none; }
        }
    </style>
</head>
<body>

    <header>
        <div class="nav-container">
            <div class="logo-box">
